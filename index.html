<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Collector</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 12px;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
#app {
  max-width: 1000px;
  margin: 0 auto;
  align-items: center;
  gap: 4px;
}
.help { color: #cbd5e1; font-size: 13px; }
#message { min-height: 22px; color: #facc15; }
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 10px;
  text-align: left;
}
.item {
  background: #374151;
  border-radius: 8px;
  padding: 12px;
  min-width: 0;
}
.preview {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}
.item button { width: 100%; }
.danger { background: #b91c1c; }
details summary {
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
}
hr { border-color: #64748b; margin: 18px 0; }
  <p class="help">Move with WASD or the arrow keys.</p>
</div>

<canvas id="game" width="700" height="420"></canvas>

<div class="panel">
  <details>
    <summary>Settings</summary>
    <div class="settings" style="margin-top:14px">
      <label>UI scale: <span id="scaleLabel">100%</span>
        <input id="uiScale" type="range" min=".75" max="1.25" step=".05" value="1">
      </label>
      <label>Sound volume: <span id="volumeLabel">50%</span>
        <input id="volume" type="range" min="0" max="1" step=".05" value=".5">
      </label>
      <label>Sound
        <select id="soundEnabled">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </label>
    </div>

    <p class="help">Change the interface size and sound volume. Sound effects play when collecting coins and losing.</p>
    <hr>
    <h3>Reset Progress</h3>
    <p class="help">Deletes your saved points, best score, purchases, and equipped items.</p>
    <button id="resetProgress" class="danger">Reset All Progress</button>
  </details>
</div>

<div class="panel">
  <h2>Customization Shop</h2>
  <p>Unlock shapes, enemy color themes, and backgrounds with points.</p>
  <div id="shop"></div>
</div>

</div>

<script>
"use strict";
    const data = JSON.parse(localStorage.getItem("coinCollectorSave") || "{}");
    const s = { ...defaultSave(), ...data };

    s.points = Math.max(0, Number(s.points) || 0);
    s.best = Math.max(0, Number(s.best) || 0);
    s.uiScale = Math.min(1.25, Math.max(.75, Number(s.uiScale) || 1));
    s.volume = Math.min(1, Math.max(0, Number(s.volume) || 0));

    if (!Array.isArray(s.ownedShapes)) s.ownedShapes = ["square"];
    if (!Array.isArray(s.ownedThemes)) s.ownedThemes = ["classic"];
    if (!Array.isArray(s.ownedBackgrounds)) s.ownedBackgrounds = ["night"];

    if (!shapes.some(x => x.id === s.shape) || !s.ownedShapes.includes(s.shape))
      s.shape = "square";
    if (!themes.some(x => x.id === s.theme) || !s.ownedThemes.includes(s.theme))
      s.theme = "classic";
    if (!backgrounds.some(x => x.id === s.background) || !s.ownedBackgrounds.includes(s.background))
      s.background = "night";

  // Scale the page content without scaling the canvas's drawing coordinates.
  $("app").style.zoom = save.uiScale;
  $("uiScale").value = save.uiScale;
  $("scaleLabel").textContent = Math.round(save.uiScale * 100) + "%";
  $("volume").value = save.volume;
  $("volumeLabel").textContent = Math.round(save.volume * 100) + "%";
  $("soundEnabled").value = save.soundEnabled ? "on" : "off";
}

$("uiScale").addEventListener("input", () => {
  save.uiScale = Number($("uiScale").value);
  applySettings();
  saveData();
});

$("volume").addEventListener("input", () => {
  save.volume = Number($("volume").value);
  applySettings();
  saveData();
});

$("soundEnabled").addEventListener("change", () => {
  save.soundEnabled = $("soundEnabled").value === "on";
  saveData();
  if (save.soundEnabled) playSound(440, .08);
});

function playSound(frequency, duration, type="sine") {
  if (!save.soundEnabled || save.volume <= 0) return;

  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    if (!audioContext) audioContext = new AudioCtx();
    if (audioContext.state === "suspended") audioContext.resume();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
    gain.gain.setValueAtTime(save.volume * .16, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch {}
}

function randomPosition(size=18) {
  return {
    x:size + Math.random() * (canvas.width - size*2),
    y:size + Math.random() * (canvas.height - size*2)
  };
}

function placeCoin() {
  coin = randomPosition(10);
  let attempts = 0;

  while (player &&
    Math.hypot(coin.x-player.x, coin.y-player.y) < 60 &&
    attempts++ < 30) {
    coin = randomPosition(10);
  }
}

function readCustomSettings() {
  const number = (id, min, max, fallback) =>
    Math.min(max, Math.max(min, Number($(id).value) || fallback));

  const start = number("enemyStart", .5, 12, 2);

  return {
    count:Math.round(number("enemyCount", 1, 15, 3)),
    player:number("playerSpeed", 1, 8, 3.5),
    start,
    max:Math.max(start, number("enemyMax", 1, 20, 8)),
    acc:number("acceleration", 0, 1, .035)
  };
}

function startGame() {
  if (animationId !== null) cancelAnimationFrame(animationId);

  score = 0;
  gameOver = false;
  paused = false;
  running = true;

  settings = $("mode").value === "custom"
    ? readCustomSettings()
    : modes[$("mode").value];

  player = {
    x:canvas.width/2,
    y:canvas.height/2,
    size:14
  };

  enemies = [];

  for (let i=0; i<settings.count; i++) {
    const p = randomPosition(30);
    const angle = Math.random() * Math.PI * 2;
    const speed = settings.start + Math.random() * .5;

    enemies.push({
      x:p.x,
      y:p.y,
      size:13,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed,
      baseSpeed:speed
    });
  }

  placeCoin();
  keys = {};
  $("message").textContent = "Collect coins and avoid the enemies.";
  $("pause").textContent = "Pause";
  updateStats();

  draw();
      const x = player.x + Math.cos(a)*r;
      const y = player.y + Math.sin(a)*r;
      if (i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.closePath();
  } else if (save.shape === "hexagon") {
    for (let i=0; i<6; i++) {
      const a = i*Math.PI/3;
      const x = player.x + Math.cos(a)*s;
      const y = player.y + Math.sin(a)*s;
      if (i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.closePath();
  } else {
    ctx.rect(player.x-s, player.y-s, s*2, s*2);
  }

  ctx.fill();
  ctx.stroke();
}

function draw() {
  const bg = backgrounds.find(b => b.id === save.background) || backgrounds[0];

  ctx.fillStyle = bg.color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = bg.grid;
  ctx.lineWidth = 1;

  for (let x=0; x<canvas.width; x+=35) {
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  }

  for (let y=0; y<canvas.height; y+=35) {
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }

  if (coin) {
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(coin.x,coin.y,8,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#fff0a3";
    ctx.stroke();
  }

  enemies.forEach(enemy => {
    ctx.fillStyle = enemyColor(enemy);
    ctx.beginPath();
    ctx.arc(enemy.x,enemy.y,enemy.size,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff99";
    ctx.stroke();
  });

  if (player) drawPlayer();

  if (paused || gameOver) {
    ctx.fillStyle = "#000000aa";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 32px Arial";
    ctx.fillText(paused ? "PAUSED" : "GAME OVER",
      canvas.width/2,canvas.height/2);
    ctx.font = "16px Arial";
    ctx.fillText("Press Start / Restart to play again",
      canvas.width/2,canvas.height/2+32);
  }
}

/* Enemies move independently and bounce off the arena walls.
   They accelerate as the score increases but do not chase the player. */
function moveEnemy(enemy) {
  const speed = enemySpeed(enemy);
  const oldSpeed = Math.hypot(enemy.vx, enemy.vy) || 1;

  enemy.vx = enemy.vx / oldSpeed * speed;
  enemy.vy = enemy.vy / oldSpeed * speed;

  enemy.x += enemy.vx;
  enemy.y += enemy.vy;

  if (enemy.x-enemy.size <= 0) {
    enemy.x = enemy.size;
    enemy.vx = Math.abs(enemy.vx);
  } else if (enemy.x+enemy.size >= canvas.width) {
    enemy.x = canvas.width-enemy.size;
    enemy.vx = -Math.abs(enemy.vx);
  }

  if (enemy.y-enemy.size <= 0) {
    enemy.y = enemy.size;
    enemy.vy = Math.abs(enemy.vy);
  } else if (enemy.y+enemy.size >= canvas.height) {
    enemy.y = canvas.height-enemy.size;
    enemy.vy = -Math.abs(enemy.vy);
  }
}

function endGame() {
  running = false;
  gameOver = true;
  save.best = Math.max(save.best, score);
  saveData();
  updateStats();
  $("message").textContent = "Game over. Your score was " + score + ".";
  playSound(150, .35, "sawtooth");
  draw();
}

function loop() {
  if (!running) return;

  if (paused) {
    draw();
    animationId = requestAnimationFrame(loop);
    return;
  }

  let dx = 0, dy = 0;

  if (keys.ArrowLeft || keys.a) dx--;
  if (keys.ArrowRight || keys.d) dx++;
  if (keys.ArrowUp || keys.w) dy--;
  if (keys.ArrowDown || keys.s) dy++;

  if (dx && dy) {
    dx *= Math.SQRT1_2;
    dy *= Math.SQRT1_2;
  }

  player.x = Math.max(player.size,
    Math.min(canvas.width-player.size, player.x+dx*settings.player));

  player.y = Math.max(player.size,
    Math.min(canvas.height-player.size, player.y+dy*settings.player));

  if (Math.hypot(player.x-coin.x,player.y-coin.y) < player.size+8) {
    score++;
    save.points++;
    placeCoin();

    save.best = Math.max(save.best,score);
    saveData();
    updateStats();
    renderShop();

    const now = performance.now();
    if (now-lastSoundTime > 65) {
      playSound(600+(score%5)*100, .09);
      lastSoundTime = now;
    }
  }

  for (const enemy of enemies) {
    moveEnemy(enemy);

    if (Math.hypot(player.x-enemy.x,player.y-enemy.y)
      < player.size+enemy.size) {
      endGame();
      return;
    }
  }

  draw();
  animationId = requestAnimationFrame(loop);
}

$("start").addEventListener("click", startGame);

$("mode").addEventListener("change", () => {
  $("customSettings").hidden = $("mode").value !== "custom";
});

$("pause").addEventListener("click", () => {
  if (!running || gameOver) return;

  paused = !paused;
  $("pause").textContent = paused ? "Resume" : "Pause";
});

document.addEventListener("keydown", event => {
  const key = event.key.length===1 ? event.key.toLowerCase() : event.key;

  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(event.key))
    event.preventDefault();

  keys[key] = true;
});

document.addEventListener("keyup", event => {
  const key = event.key.length===1 ? event.key.toLowerCase() : event.key;
  keys[key] = false;
});

function renderShop() {
  const shop = $("shop");
  shop.replaceChildren();

  function section(title, items, ownedKey, equippedKey, type) {
    const heading = document.createElement("h3");
    heading.textContent = title;
    shop.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "shop-grid";

    items.forEach(item => {
      const owned = save[ownedKey].includes(item.id);
      const equipped = save[equippedKey] === item.id;

      const card = document.createElement("div");
      card.className = "item";

      const name = document.createElement("b");
      name.textContent = item.name;
      card.appendChild(name);

      const preview = document.createElement("div");
      preview.className = "preview";

      if (type === "shape") {
        preview.textContent = item.symbol;
        preview.style.color = "#60a5fa";
      } else if (type === "theme") {
        preview.style.gap = "3px";

        item.colors.forEach(color => {
          const dot = document.createElement("span");
          dot.style.cssText =
            "display:inline-block;width:19px;height:19px;border-radius:50%;background:"+
            color+";border:1px solid white";
          preview.appendChild(dot);
        });
      } else {
        preview.style.background = item.color;
        preview.style.border = "2px solid " + item.grid;
        preview.style.margin = "8px 0";
      }

      card.appendChild(preview);

      const description = document.createElement("p");
      description.textContent = equipped
        ? "Equipped"
        : owned ? "Unlocked" : item.price + " points";
      card.appendChild(description);

      const button = document.createElement("button");
      button.textContent = equipped ? "Equipped" : owned ? "Equip" : "Buy";
      button.disabled = equipped;

      button.addEventListener("click", () => {
        if (!owned) {
          if (save.points < item.price) {
            $("message").textContent =
              "You need " + (item.price-save.points) + " more points.";
            return;
          }

          save.points -= item.price;
          save[ownedKey].push(item.id);
        }

        save[equippedKey] = item.id;
        saveData();
        updateStats();
        renderShop();
        draw();

        $("message").textContent = item.name +
          (owned ? " equipped." : " unlocked and equipped.");

        playSound(700,.1);
      });

      card.appendChild(button);
      grid.appendChild(card);
    });

    shop.appendChild(grid);
  }

  section("Player Shapes",shapes,"ownedShapes","shape","shape");
  section("Enemy Color Themes",themes,"ownedThemes","theme","theme");
  section("Backgrounds",backgrounds,"ownedBackgrounds","background","background");
}

$("resetProgress").addEventListener("click", () => {
  if (!confirm(
    "Reset ALL progress? Your points, best score, purchases, and customizations will be deleted. This cannot be undone."
  )) return;

  save = defaultSave();
  saveData();

  applySettings();
  updateStats();
  renderShop();

  $("mode").value = "medium";
  $("customSettings").hidden = true;

  startGame();
  $("message").textContent = "Progress reset. A new game has started.";
});

/* INITIALIZE EVERYTHING AND START PLAYING AUTOMATICALLY */
applySettings();
updateStats();
renderShop();
startGame();

</script>
